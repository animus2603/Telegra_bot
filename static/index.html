<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аль-Машрик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E8C96A;
            --gold-dim: #8A6F2E;
            --bg: #0A0A0A;
            --bg2: #111111;
            --bg3: #1A1A1A;
            --text: #F0E6CC;
            --text-dim: #8A7D65;
            --border: rgba(201,168,76,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,168,76,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .pattern-top {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 16px 12px; position: relative; z-index: 1;
        }
        .header-center { text-align: center; flex: 1; }
        .header-ornament { font-size: 10px; letter-spacing: 5px; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 3px; }
        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px; font-weight: 600; color: var(--gold-light);
            letter-spacing: 2px; text-shadow: 0 0 30px rgba(201,168,76,0.3);
        }
        .header-arabic { font-size: 14px; color: var(--gold-dim); font-weight: 300; }
        .btn-profile {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--gold); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; flex-shrink: 0;
        }
        .btn-profile:active { border-color: var(--gold); }
        .categories {
            display: flex; gap: 8px;
            padding: 4px 16px 14px;
            overflow-x: auto; scrollbar-width: none; position: relative; z-index: 1;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0; padding: 6px 14px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-dim); font-family: 'Tajawal', sans-serif;
            font-size: 12px; cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .cat-btn.active { border-color: var(--gold); color: var(--gold-light); background: rgba(201,168,76,0.05); }
        .section-title {
            font-size: 10px; letter-spacing: 4px; color: var(--gold-dim);
            text-transform: uppercase; padding: 0 16px 10px; position: relative; z-index: 1;
        }
        .products {
            padding: 0 16px; display: flex; flex-direction: column;
            gap: 2px; position: relative; z-index: 1;
        }
        .card {
            background: var(--bg2); border: 1px solid var(--border);
            padding: 12px; display: flex; gap: 12px; align-items: center;
            animation: fadeIn 0.5s ease forwards; opacity: 0;
        }
        .card:first-child { border-radius: 8px 8px 0 0; }
        .card:last-child { border-radius: 0 0 8px 8px; }
        .card:only-child { border-radius: 8px; }
        .card:active { background: var(--bg3); }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.1s}
        .card:nth-child(3){animation-delay:.15s}.card:nth-child(4){animation-delay:.2s}
        .card:nth-child(5){animation-delay:.25s}.card:nth-child(6){animation-delay:.3s}
        .card-emoji {
            width: 60px; height: 60px; background: var(--bg3);
            border-radius: 6px; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0; cursor: pointer;
            transition: transform 0.2s;
        }
        .card-emoji:active { transform: scale(0.93); }
        .card-info { flex: 1; min-width: 0; }
        .card-name {
            font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600;
            color: var(--text); margin-bottom: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; line-height: 1.4; }
        .card-bottom { display: flex; align-items: center; justify-content: space-between; }
        .card-price { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--gold); }
        .card-price span { font-size: 10px; font-family: 'Tajawal', sans-serif; color: var(--gold-dim); }
        .btn-add {
            width: 28px; height: 28px; background: transparent;
            border: 1px solid var(--gold-dim); color: var(--gold);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; border-radius: 2px;
        }
        .btn-add:active { background: var(--gold); color: var(--bg); transform: scale(0.9); }

        /* Модальное окно товара */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 300; opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-box {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 12px; width: 100%; max-width: 340px;
            position: relative;
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
            overflow: hidden;
        }
        .modal-overlay.open .modal-box { transform: scale(1); }
        .modal-close {
            position: absolute; top: 10px; right: 10px;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: var(--text); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; transition: all 0.2s;
        }
        .modal-close:active { background: var(--gold); color: var(--bg); }
        .modal-img {
            width: 100%; height: 200px;
            background: var(--bg3);
            display: flex; align-items: center; justify-content: center;
            font-size: 80px;
            border-bottom: 1px solid var(--border);
        }
        .modal-body { padding: 18px; }
        .modal-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px; font-weight: 600; color: var(--gold-light);
            margin-bottom: 6px;
        }
        .modal-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; }
        .modal-footer { display: flex; align-items: center; justify-content: space-between; }
        .modal-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px; font-weight: 600; color: var(--gold);
        }
        .modal-price span { font-size: 13px; font-family: 'Tajawal', sans-serif; color: var(--gold-dim); }
        .modal-btn-add {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--gold-dim), var(--gold));
            color: var(--bg); border: none;
            font-family: 'Tajawal', sans-serif; font-size: 12px;
            font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; border-radius: 2px; transition: all 0.2s;
        }
        .modal-btn-add:active { opacity: 0.85; transform: scale(0.96); }

        /* Корзина */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg2); border-top: 1px solid var(--border);
            z-index: 50; display: none;
        }
        .cart-bar-main {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; cursor: pointer;
        }
        .cart-bar-left { display: flex; align-items: center; gap: 10px; }
        .cart-bar-icon { font-size: 20px; }
        .cart-bar-label { font-size: 12px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
        .cart-bar-qty {
            background: var(--gold); color: var(--bg);
            font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
        }
        .cart-bar-total { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--gold); }
        .cart-bar-arrow { color: var(--gold-dim); font-size: 14px; transition: transform 0.3s; margin-left: 8px; }
        .cart-bar.open .cart-bar-arrow { transform: rotate(180deg); }
        .cart-expanded {
            max-height: 0; overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
            border-top: 1px solid var(--border);
        }
        .cart-bar.open .cart-expanded { max-height: 500px; overflow-y: auto; }
        .cart-expanded-inner { padding: 0 16px 16px; }
        .cart-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px;
        }
        .cart-item:last-of-type { border-bottom: none; }
        .cart-item-name { font-family: 'Cormorant Garamond', serif; font-size: 14px; flex: 1; }
        .cart-item-qty { font-size: 11px; color: var(--gold-dim); }
        .cart-item-price { font-size: 13px; color: var(--gold); white-space: nowrap; }
        .btn-remove { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px 6px; }
        .btn-remove:active { color: #e74c3c; }
        .cart-summary { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .cart-summary-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; color: var(--text-dim); }
        .cart-summary-row.total {
            margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border);
            font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--gold-light);
        }
        .btn-order {
            margin-top: 12px; width: 100%; padding: 13px;
            background: linear-gradient(135deg, var(--gold-dim), var(--gold));
            color: var(--bg); border: none;
            font-family: 'Tajawal', sans-serif; font-size: 12px;
            font-weight: 500; letter-spacing: 3px; text-transform: uppercase;
            cursor: pointer; border-radius: 2px; transition: all 0.3s;
        }
        .btn-order:active { opacity: 0.85; transform: scale(0.98); }

        /* Профиль */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.open { opacity: 1; pointer-events: all; }
        .profile-panel {
            position: fixed; top: 0; right: -100%; bottom: 0;
            width: 85%; max-width: 320px;
            background: var(--bg2); border-left: 1px solid var(--border);
            z-index: 101; transition: right 0.4s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto; display: flex; flex-direction: column;
        }
        .profile-panel.open { right: 0; }
        .panel-top { height: 3px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent); }
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 16px 16px; border-bottom: 1px solid var(--border);
        }
        .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--gold-light); letter-spacing: 1px; }
        .btn-close { background: transparent; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px; }
        .btn-close:active { color: var(--gold); }
        .panel-avatar {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--bg3); border: 2px solid var(--gold-dim);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin: 20px auto 12px;
        }
        .panel-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold-light); text-align: center; margin-bottom: 2px; }
        .panel-username { font-size: 11px; color: var(--text-dim); text-align: center; letter-spacing: 1px; margin-bottom: 16px; }
        .panel-info { padding: 0 16px; }
        .panel-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .panel-row:last-child { border-bottom: none; }
        .panel-icon { font-size: 16px; width: 24px; text-align: center; }
        .panel-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
        .panel-value { font-size: 15px; color: var(--text); font-family: 'Cormorant Garamond', serif; }
        .orders-section { padding: 20px 16px; flex: 1; }
        .orders-heading { font-size: 10px; letter-spacing: 4px; color: var(--gold-dim); text-transform: uppercase; margin-bottom: 12px; }
        .order-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-date { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }
        .order-total { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold); }
        .order-item { font-size: 12px; color: var(--text-dim); padding: 2px 0; }
        .order-item span { color: var(--text); }
        .empty-box { text-align: center; padding: 20px; color: var(--text-dim); font-size: 11px; border: 1px solid var(--border); letter-spacing: 1px; }
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: var(--bg3); border: 1px solid var(--gold);
            color: var(--gold-light); padding: 10px 22px;
            font-size: 12px; letter-spacing: 1px; border-radius: 2px;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            z-index: 200; white-space: nowrap; opacity: 0;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="pattern-top"></div>

<div class="header">
    <div style="width:40px"></div>
    <div class="header-center">
        <div class="header-ornament">✦ Ресторан ✦</div>
        <h1>Аль-Машрик</h1>
        <div class="header-arabic">المشرق</div>
    </div>
    <button class="btn-profile" onclick="openProfile()">👤</button>
</div>

<div class="categories">
    <button class="cat-btn active" onclick="filterCat(this,'all')">Всё</button>
    <button class="cat-btn" onclick="filterCat(this,'hot')">🍖 Горячее</button>
    <button class="cat-btn" onclick="filterCat(this,'soup')">🍲 Супы</button>
    <button class="cat-btn" onclick="filterCat(this,'salad')">🥗 Салаты</button>
    <button class="cat-btn" onclick="filterCat(this,'drink')">☕ Напитки</button>
</div>

<div class="section-title">— Блюда</div>
<div class="products" id="products">Загрузка...</div>

<!-- Модальное окно товара -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-box" id="modal-box">
        <button class="modal-close" onclick="closeModalBtn()">✕</button>
        <div class="modal-img" id="modal-img"></div>
        <div class="modal-body">
            <div class="modal-name" id="modal-name"></div>
            <div class="modal-desc" id="modal-desc"></div>
            <div class="modal-footer">
                <div class="modal-price" id="modal-price"></div>
                <button class="modal-btn-add" id="modal-btn-add">+ В корзину</button>
            </div>
        </div>
    </div>
</div>

<!-- Корзина -->
<div class="cart-bar" id="cart-bar">
    <div class="cart-bar-main" onclick="toggleCart()">
        <div class="cart-bar-left">
            <span class="cart-bar-icon">🛒</span>
            <span class="cart-bar-label">Корзина</span>
            <span class="cart-bar-qty" id="cart-qty">0</span>
        </div>
        <div style="display:flex;align-items:center">
            <span class="cart-bar-total" id="cart-total">0 ₽</span>
            <span class="cart-bar-arrow">▲</span>
        </div>
    </div>
    <div class="cart-expanded">
        <div class="cart-expanded-inner">
            <div id="cart-items-list"></div>
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>Сумма блюд</span>
                    <span id="summary-subtotal">0 ₽</span>
                </div>
                <div class="cart-summary-row">
                    <span>Обслуживание 15%</span>
                    <span id="summary-service">0 ₽</span>
                </div>
                <div class="cart-summary-row total">
                    <span>Итого</span>
                    <span id="summary-total">0 ₽</span>
                </div>
            </div>
            <button class="btn-order" onclick="sendOrder()">✦ Оформить заказ ✦</button>
        </div>
    </div>
</div>

<!-- Профиль -->
<div class="overlay" id="overlay" onclick="closeProfile()"></div>
<div class="profile-panel" id="profile-panel">
    <div class="panel-top"></div>
    <div class="panel-header">
        <div class="panel-title">Профиль</div>
        <button class="btn-close" onclick="closeProfile()">✕</button>
    </div>
    <div class="panel-avatar">👤</div>
    <div class="panel-name" id="p-name">—</div>
    <div class="panel-username" id="p-username"></div>
    <div class="panel-info">
        <div class="panel-row">
            <div class="panel-icon">📞</div>
            <div>
                <div class="panel-label">Телефон</div>
                <div class="panel-value" id="p-phone">—</div>
            </div>
        </div>
        <div class="panel-row">
            <div class="panel-icon">🪑</div>
            <div>
                <div class="panel-label">Количество гостей</div>
                <div class="panel-value" id="p-guests">—</div>
            </div>
        </div>
    </div>
    <div class="orders-section">
        <div class="orders-heading">— История заказов</div>
        <div id="orders-list"><div class="empty-box">Заказов пока нет</div></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const userId = tg?.initDataUnsafe?.user?.id || 0;
    const username = tg?.initDataUnsafe?.user?.username || '';

    let cart = [];
    let allProducts = [];
    let cartOpen = false;
    let modalProduct = null;

    const EMOJIS = { hot:'🍖', soup:'🍲', salad:'🥗', drink:'☕' };

    fetch('/api/products')
        .then(r => r.json())
        .then(p => { allProducts = p; renderProducts(p); })
        .catch(() => {
            allProducts = [
                {id:1,name:'Шашлык из баранины',description:'Нежное мясо на углях, восточные специи',price:2800,category:'hot'},
                {id:2,name:'Шурпа',description:'Наваристый суп с бараниной и овощами',price:950,category:'soup'},
                {id:3,name:'Самса',description:'Слоёное тесто с мясом и луком',price:450,category:'hot'},
                {id:4,name:'Чайхана-плов',description:'Узбекский плов с морковью и изюмом',price:1200,category:'hot'},
                {id:5,name:'Ачичук',description:'Свежий салат из помидоров с зеленью',price:550,category:'salad'},
                {id:6,name:'Чай с чабрецом',description:'Горный чай с мёдом',price:320,category:'drink'},
            ];
            renderProducts(allProducts);
        });

    function renderProducts(products) {
        const el = document.getElementById('products');
        if (!products.length) { el.innerHTML = '<div class="empty-box">Нет блюд</div>'; return; }
        el.innerHTML = products.map(p => `
            <div class="card">
                <div class="card-emoji" onclick="openModal(${p.id})">${EMOJIS[p.category]||'🍽'}</div>
                <div class="card-info">
                    <div class="card-name">${p.name}</div>
                    <div class="card-desc">${p.description||''}</div>
                    <div class="card-bottom">
                        <div class="card-price">${p.price.toLocaleString()} <span>₽</span></div>
                        <button class="btn-add" onclick="addToCart(${p.id},'${p.name}',${p.price})">+</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterCat(btn, cat) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts(cat==='all' ? allProducts : allProducts.filter(p=>p.category===cat));
    }

    // Модальное окно
    function openModal(id) {
        const p = allProducts.find(p=>p.id===id);
        if (!p) return;
        modalProduct = p;
        document.getElementById('modal-img').textContent = EMOJIS[p.category]||'🍽';
        document.getElementById('modal-name').textContent = p.name;
        document.getElementById('modal-desc').textContent = p.description||'';
        document.getElementById('modal-price').innerHTML = p.price.toLocaleString()+' <span>₽</span>';
        document.getElementById('modal-btn-add').onclick = () => {
            addToCart(p.id, p.name, p.price);
            closeModalBtn();
        };
        document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal(e) {
        if (e.target === document.getElementById('modal-overlay')) closeModalBtn();
    }

    function closeModalBtn() {
        document.getElementById('modal-overlay').classList.remove('open');
        modalProduct = null;
    }

    function addToCart(id, name, price) {
        const ex = cart.find(i=>i.id===id);
        if (ex) ex.qty++; else cart.push({id, name, price, qty:1});
        renderCart();
        showToast('Добавлено ✦');
    }

    function removeFromCart(id) {
        cart = cart.filter(i=>i.id!==id);
        renderCart();
        if (!cart.length) { cartOpen = false; document.getElementById('cart-bar').classList.remove('open'); }
    }

    function renderCart() {
        const bar = document.getElementById('cart-bar');
        const qty = cart.reduce((s,i)=>s+i.qty, 0);
        const subtotal = cart.reduce((s,i)=>s+i.price*i.qty, 0);
        const service = Math.round(subtotal * 0.15);
        const total = subtotal + service;

        if (!cart.length) { bar.style.display='none'; return; }
        bar.style.display='block';

        document.getElementById('cart-qty').textContent = qty;
        document.getElementById('cart-total').textContent = total.toLocaleString()+' ₽';
        document.getElementById('summary-subtotal').textContent = subtotal.toLocaleString()+' ₽';
        document.getElementById('summary-service').textContent = service.toLocaleString()+' ₽';
        document.getElementById('summary-total').textContent = total.toLocaleString()+' ₽';

        document.getElementById('cart-items-list').innerHTML = cart.map(i=>`
            <div class="cart-item">
                <span class="cart-item-name">${i.name} <span class="cart-item-qty">×${i.qty}</span></span>
                <span class="cart-item-price">${(i.price*i.qty).toLocaleString()} ₽</span>
                <button class="btn-remove" onclick="removeFromCart(${i.id})">✕</button>
            </div>
        `).join('');
    }

    function toggleCart() {
        cartOpen = !cartOpen;
        document.getElementById('cart-bar').classList.toggle('open', cartOpen);
    }

    function sendOrder() {
        if (!cart.length) return;
        const subtotal = cart.reduce((s,i)=>s+i.price*i.qty, 0);
        const service = Math.round(subtotal * 0.15);
        const total = subtotal + service;

        fetch('/api/order', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({user_id: userId, username, items: cart, subtotal, service, total})
        })
        .then(r=>r.json())
        .then(()=>{
            if (tg) tg.showAlert(`✦ Заказ принят!\n\nСумма блюд: ${subtotal.toLocaleString()} ₽\nОбслуживание (15%): ${service.toLocaleString()} ₽\nИтого: ${total.toLocaleString()} ₽`);
            else showToast('Заказ отправлен!');
            cart = [];
            cartOpen = false;
            document.getElementById('cart-bar').classList.remove('open');
            renderCart();
        });
    }

    function openProfile() {
        document.getElementById('profile-panel').classList.add('open');
        document.getElementById('overlay').classList.add('open');
        loadProfile();
    }

    function closeProfile() {
        document.getElementById('profile-panel').classList.remove('open');
        document.getElementById('overlay').classList.remove('open');
    }

    function loadProfile() {
        if (!userId) { document.getElementById('p-name').textContent = 'Гость'; return; }
        fetch(`/api/user/${userId}`)
            .then(r=>r.json())
            .then(u=>{
                if (u.error) return;
                document.getElementById('p-name').textContent = u.full_name || '—';
                document.getElementById('p-username').textContent = u.username ? `@${u.username}` : '';
                document.getElementById('p-phone').textContent = u.phone || '—';
                document.getElementById('p-guests').textContent = u.guests ? `${u.guests} чел.` : '—';
            });

        fetch(`/api/orders/${userId}`)
            .then(r=>r.json())
            .then(orders=>{
                const el = document.getElementById('orders-list');
                if (!orders.length) { el.innerHTML='<div class="empty-box">Заказов пока нет</div>'; return; }
                el.innerHTML = orders.map(o=>{
                    const date = new Date(o.created_at).toLocaleDateString('ru-RU',{
                        day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'
                    });
                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <div class="order-date">${date}</div>
                                <div class="order-total">${o.total.toLocaleString()} ₽</div>
                            </div>
                            ${o.items.map(i=>`<div class="order-item">• <span>${i.name}</span> ×${i.qty}</div>`).join('')}
                        </div>
                    `;
                }).join('');
            });
    }

    let toastTimer;
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
    }
</script>
</body>
</html>
